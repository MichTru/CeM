<!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Galleria a schermo intero" hidden>
    <div class="lightbox__stage"></div>
    <button type="button" class="lightbox__close round-btn" aria-label="Chiudi"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
    <button type="button" class="lightbox__prev round-btn" aria-label="Precedente"><svg class="ico ico--flip" aria-hidden="true"><use href="#i-chev"/></svg></button>
    <button type="button" class="lightbox__next round-btn" aria-label="Successiva"><svg class="ico" aria-hidden="true"><use href="#i-chev"/></svg></button>
    <p class="lightbox__caption" aria-live="polite"></p>
  </div>
